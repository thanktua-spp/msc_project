_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

task_name: lift
exp_name: default

dataset_type: ph
dataset_path: ${oc.env:PWD}/data/task/${task_name}/image_abs.hdf5
abs_action: True

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

name: train_diffusion_unet_hybrid

shape_meta:
  action:
    shape: [10]
  obs:
    agentview_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]  
    robot0_eef_quat:
      shape: [4]
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_gripper_qpos:
      shape: [2]

task:
  abs_action: ${abs_action}
  dataset:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    abs_action: ${abs_action}
    dataset_path: ${dataset_path}
    horizon: 16
    n_obs_steps: 2
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    shape_meta: ${shape_meta}
    use_cache: false
    val_ratio: 0.01
  dataset_path: ${dataset_path}
  #dataset_type: ph
  
  env_runner:
    _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
    abs_action: ${abs_action}
    crf: 22
    dataset_path: ${dataset_path}
    fps: 10
    max_steps: 400
    n_action_steps: 8
    n_envs: null
    n_obs_steps: 2
    n_test: 10
    n_train: 6
    n_train_vis: 2
    n_test_vis: 2
    past_action: false
    render_obs_key: agentview_image
    shape_meta: ${shape_meta}
    test_start_seed: 100000
    tqdm_interval_sec: 1.0
    train_start_idx: 0
  name: lift_image
  shape_meta: ${shape_meta}
  task_name: ${task_name}

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
  
# can and should increase batch size and num workers
dataloader:
  batch_size: 16 # try 64
  num_workers: 4 #try 8/12
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 16
  num_workers: 4 #try 8/12
  persistent_workers: false
  pin_memory: true
  shuffle: false

policy:
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy
  cond_predict_scale: true
  diffusion_step_embed_dim: 64
  down_dims: [128, 256, 512]
  #eval_fixed_crop: true
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: 8
  n_groups: 8
  n_obs_steps: 2

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small

  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_rgb_model
      name: "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
      weights: null
      pretrained: true
    resize_shape: null
    crop_shape: [76, 76]
    # constant center crop
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  #obs_encoder_group_norm: true
  shape_meta: ${shape_meta}


training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  
  gradient_accumulate_every: 2
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  use_ema: True
  freeze_encoder: False
  
  # training loop control
  # in epochs
  num_epochs: 2
  rollout_every: 2 # keep both rollout_every checkpoint_every the same and higher
  checkpoint_every: 2
  val_every: 1 # keep both val_every sample_every the same
  sample_every: 1
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0


optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

logging:
  project: diffusion_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null


checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}


hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
