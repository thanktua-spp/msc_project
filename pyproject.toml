[project]
name = "msc-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=15.0.0",
    "datasets>=2.19.0,<=3.6.0",
    "diffusers>=0.34.0",
    "einops>=0.8.1",
    "grad-cam>=1.5.5",
    "gym==0.22.0",
    "gymnasium>=0.29.1",
    "hf-xet>=1.1.5",
    "hydra-core>=1.3.2",
    "ipykernel>=6.30.0",
    "matplotlib>=3.10.5",
    "mujoco>=3.3.5",
    "numba>=0.61.2",
    "omegaconf>=2.3.0",
    "pybullet>=3.2.7",
    "pygame==2.1.2",
    "pymunk>=6.6.0,<7.0.0",
    "rich>=14.1.0",
    "robosuite>=1.5.1",
    "scikit-image>=0.25.2",
    "scikit-video>=1.1.11",
    "setuptools==57.5.0",
    "shapely==1.8.4",
    "tensorflow>=2.19.0",
    "tensorflow-datasets>=4.9.9",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "torchvision>=0.22.1",
    "trackio>=0.2.3",
    "wandb>=0.21.1",
    "wheel==0.37.0",
    "zarr>=2.18.3",
]

[dependency-groups]
dev = [
    "jupyterlab-code-formatter>=3.0.2",
    "nbqa>=1.9.1",
    "ruff>=0.12.7",
]










[tool.ruff]
# Include notebooks
extend-include = ["*.ipynb"]

# Set tab size to 4 spaces
indent-width = 4
line-length = 88

# Exclude a variety of commonly ignored directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Assume Python 3.8+
target-version = "py38"

[tool.ruff.lint]
# Enable rules - moved from top-level to lint section
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

# Rules to ignore - moved from top-level to lint section
ignore = []

# Allow fix for all enabled rules - moved from top-level to lint section
fixable = ["ALL"]
unfixable = []

# Notebook-specific settings
[tool.ruff.lint.per-file-ignores]
# Allow longer lines in notebooks for markdown cells
"*.ipynb" = [
    "E402",  # Module level import not at top of file (common in notebooks)
    "B018",  # Found useless expression (notebooks often display values)
    "F401",  # Imported but unused (notebooks often import in different cells)
    "E501",  # Line too long (notebooks can have long lines)
]

[tool.ruff.format]
# Like Black, use double quotes for strings
quote-style = "double"

# Use 4-space indentation (moved from top-level)
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"
